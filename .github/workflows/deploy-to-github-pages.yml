name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            # - name: Checkout repository
            #   uses: actions/checkout@v4

            # - name: Setup Node.js
            #   uses: actions/setup-node@v4
